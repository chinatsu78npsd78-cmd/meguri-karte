<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>めぐり陰陽カルテ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fbeedf;--soft:#d6b99c;--line:rgba(255,214,170,.22);--baby:#f7c4d0;--gold:#e2b073}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);
  font-family:"Zen Kaku Gothic New","Yu Gothic",sans-serif;background:#1c120c;
  background-image:radial-gradient(ellipse at 18% -5%,rgba(255,176,96,.42) 0,transparent 55%),radial-gradient(ellipse at 85% 8%,rgba(247,190,205,.22) 0,transparent 45%),radial-gradient(ellipse at 10% 100%,rgba(150,70,30,.35) 0,transparent 55%)}
.box{width:100%;max-width:380px;text-align:center;background:rgba(58,36,24,.72);border:1px solid var(--line);border-radius:22px;padding:34px 24px;box-shadow:0 12px 34px rgba(0,0,0,.45)}
h1{font-family:"Shippori Mincho",serif;font-weight:500;font-size:26px;letter-spacing:.12em;margin:0 0 6px;text-shadow:0 0 14px rgba(0,0,0,.7)}
p{font-size:13px;color:var(--soft);margin:0 0 20px}
input{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(40,25,17,.8);color:var(--ink);text-align:center}
button{margin-top:12px;width:100%;font:inherit;font-weight:700;letter-spacing:.1em;padding:12px;border:0;border-radius:999px;background:var(--baby);color:#3a2018;cursor:pointer}
.err{color:var(--baby);min-height:1.6em;margin:10px 0 0;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h1>めぐり陰陽カルテ</h1>
  <p>あいことばを入れてください</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="あいことば">
  <button id="go">ひらく</button>
  <p class="err" id="err"></p>
</div>
<script src="app.enc.js"></script>
<script>
const KEY="meguri_karte_pass";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pass,silent){
  const L=window.MEGURI_LOCK, err=document.getElementById("err");
  try{
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(L.salt),iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(L.iv)},key,b64(L.data)));
    try{localStorage.setItem(KEY,pass);}catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    try{localStorage.removeItem(KEY);}catch(_){}
    if(!silent) err.textContent="あいことばがちがうようです。もう一度入れてみてください。";
  }
}
document.getElementById("go").onclick=()=>{const v=document.getElementById("pass").value.trim(); if(v) open_(v,false);};
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("go").click();});
try{const s=localStorage.getItem(KEY); if(s) open_(s,true);}catch(e){}
</script>
</body>
</html>
